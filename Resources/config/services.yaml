services:
    # Services whose dependencies are all guaranteed go here, wired explicitly.
    #
    # Anything conditional — a brick that needs an optional package, or a service the
    # application may not have — is registered from the extension or removed by a compiler
    # pass instead. Cf. DependencyInjection/UiExtension.php.

    _defaults:
        autowire: true
        autoconfigure: true

    # Le jeu d'icônes : ses deux tables sont posées par l'extension depuis la configuration.
    Jul6Art\UiBundle\Ui\IconSet:
        arguments:
            $icons: []
            $currencyIcons: []

    # Les types de formulaire. `autoconfigure` leur pose le tag `form.type`, ce qui les rend
    # utilisables par leur FQCN sans que le projet déclare quoi que ce soit.
    Jul6Art\UiBundle\Form\Type\:
        resource: '../../Form/Type/'
